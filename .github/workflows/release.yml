name: Release

# Tag a commit and this produces the ZIP the field tester downloads. Tying every
# build to a tag means you always know exactly which commit produced a result --
# which matters when the person running the camera is somewhere else.
on:
  push:
    tags:
      - 'v*'
      - 'phase-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps the commit into the assembly version.
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/Photobooth.Web/package-lock.json

      - name: Build the frontend
        working-directory: src/Photobooth.Web
        run: |
          npm ci
          npm run build

      - name: Test
        run: dotnet test --configuration Release --logger "console;verbosity=minimal"

      - name: Publish self-contained
        run: >
          dotnet publish src/Photobooth.Server
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          --output artifacts/publish

      - name: Package
        shell: pwsh
        run: |
          $name = "photobooth-$($env:GITHUB_REF_NAME)-win-x64"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item docs/FIELD-TEST.md artifacts/publish/ -ErrorAction SilentlyContinue
          Compress-Archive -Path artifacts/publish/* -DestinationPath "artifacts/$name.zip"
          echo "ASSET=artifacts/$name.zip" >> $env:GITHUB_ENV

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          # A tag pushed before its release exists should still produce one.
          generate_release_notes: false
          fail_on_unmatched_files: true
